<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f1f1f" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#e4e4e4" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Notus">
<link rel="manifest" href="manifest.webmanifest">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Notus</title>
<style>
/* Brut: one dark screen, no page scroll. 8 px grid, 16 px gutter, no radius, no shadow, no gradient but the hues.
   Rows: top 48 · photo (flex) · drawer 128 (menu 48 + 8 + dial 56 + 16) · bottom 48. Four greys only. */
:root{--bg:#111111;--panel:#1f1f1f;--fg:#f2f2f2;--muted:#c4c4c4;--accent:#f2f2f2;--on:#111111;--shade:rgba(17,17,17,.9);--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color-scheme:dark}
/* light mode, same rule: two very light greys, two very dark */
@media (prefers-color-scheme:light){:root{--bg:#f2f2f2;--panel:#e4e4e4;--fg:#111111;--muted:#3a3a3a;--accent:#111111;--on:#f2f2f2;--shade:rgba(242,242,242,.92);color-scheme:light}}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{background:var(--bg);color:var(--fg);font:14px/1.3 var(--mono)}
button,.btn{font:inherit;color:inherit;background:none;border:0;border-radius:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.3}
button:focus-visible,.btn:focus-within{outline:2px solid var(--fg);outline-offset:-2px}
#file{position:fixed;left:-100px;top:0;width:1px;height:1px;opacity:0;pointer-events:none}
.screen{height:100%;height:100dvh;display:flex;flex-direction:column}
.screen:not(.ready) .top{display:none}
.cap{text-transform:uppercase;letter-spacing:.08em}

.top{display:flex;align-items:stretch;height:48px;background:var(--panel);padding:env(safe-area-inset-top,0px) max(8px,env(safe-area-inset-right,0px)) 0 max(8px,env(safe-area-inset-left,0px));box-sizing:content-box}
.top .sp{flex:1}
.top .btn,.top button{display:flex;align-items:center;padding:0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.top .ico{font-size:18px;letter-spacing:0;min-width:40px;justify-content:center}

.photo{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:8px;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
.photo canvas{display:block;transform-origin:center;will-change:transform}
.manual .photo{padding:0}
.manual .drawer{display:none!important}
.empty{display:grid;gap:16px;justify-items:center;text-align:center;padding:16px}
.empty .pick{display:flex;align-items:center;justify-content:center;width:min(80vw,320px);height:64px;background:var(--fg);color:var(--on);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;cursor:pointer}
.empty p{margin:0;color:var(--muted);font-size:12px;max-width:28em}
.err{color:var(--fg)!important;text-decoration:underline}
.photo .tip{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--bg);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:8px 12px;pointer-events:none;white-space:nowrap;opacity:0}
.photo .tip.on{opacity:1}

/* analysis: dark screen, the word and three squares pulsing (opacity only, so it keeps moving while the detector runs) */
#busy{position:fixed;inset:0;z-index:40;background:var(--shade);display:flex;align-items:center;justify-content:center;gap:16px;font-size:14px;text-transform:uppercase;letter-spacing:.1em}
#busy .dots{display:flex;gap:6px}
#busy .dots i{width:8px;height:8px;background:var(--fg);animation:pulse 1s infinite}
#busy .dots i:nth-child(2){animation-delay:.2s}
#busy .dots i:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,80%,100%{opacity:.15}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){#busy .dots i{animation:none;opacity:1}}
/* option wheel: strong shade; entries slide behind the menu row, the current one on it */
#shade{position:fixed;inset:0;background:var(--shade);z-index:30;pointer-events:none}
#wheel{position:fixed;inset:0;z-index:31;pointer-events:none;overflow:hidden}
#wheelItems{position:absolute;left:var(--x,0px);width:var(--w,100%);top:0;transform:translateY(var(--y,0));transition:transform .12s ease-out}
#wheelItems div{height:48px;display:flex;align-items:center;padding:0 16px 0 44px;font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
#wheelItems div.cur{background:var(--fg);color:var(--on)}
.picking .sl .dial,.picking .sl .menu{visibility:hidden}

.drawer{height:128px;box-sizing:border-box;overflow:hidden;background:var(--panel);padding:0 16px 16px}
#drExport{display:grid;grid-template-rows:48px 48px auto;gap:8px;padding-top:16px;align-content:start}
#drReglages,#drRendu{touch-action:none;user-select:none;-webkit-user-select:none}
.bottom{display:grid;grid-template-columns:repeat(3,1fr);height:48px;background:var(--panel);border-top:1px solid var(--bg);padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);box-sizing:content-box}
.bottom button{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.bottom button[aria-pressed="true"]{color:var(--fg);box-shadow:inset 0 2px 0 var(--fg)}
.bottom.one{grid-template-columns:1fr}
.bottom.one button{background:var(--fg);color:var(--on);font-weight:700;letter-spacing:.1em}
.full .top,.full .drawer,.full .bottom{display:none!important}

/* --- dial --- */
.sl{display:grid;grid-template-rows:48px 56px;gap:8px;touch-action:none;user-select:none;-webkit-user-select:none}
.sl .dial,.sl .go{grid-row:2}
.sl .go{background:var(--fg);color:var(--on);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.1em}
.sl .menu{display:flex;align-items:center;gap:12px;margin:0 -16px;padding:0 16px;border-bottom:1px solid var(--bg);font-size:14px;text-transform:uppercase;letter-spacing:.08em;cursor:ns-resize}
.sl .menu .chev{color:var(--muted);width:16px;letter-spacing:0}
/* groove: dark channel across the screen, a hard mask for what scrolls inside */
.sl .dial{position:relative;margin:0 -16px;overflow:hidden;cursor:ew-resize}
.sl .strip{position:absolute;left:0;top:0;height:100%;will-change:transform}
.sl .sq{position:absolute;top:14px;width:32px;height:32px;margin-left:-16px;background:var(--muted);color:var(--on);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.sl .sq.em{background:none;font-size:24px;font-weight:400}
.sl .bar{position:absolute;top:14px;height:32px;margin-left:-16px}
.sl .pip{position:absolute;top:calc(30px - var(--pip) / 2);width:var(--pip);height:var(--pip);margin-left:calc(var(--pip) / -2);background:var(--muted)}
.sl .pip.mid{background:var(--fg);transform:scale(1.6)}
.sl .sel{position:absolute;left:50%;top:8px;width:44px;height:44px;margin-left:-22px;box-sizing:border-box;border:2px solid var(--fg);z-index:3;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--fg);pointer-events:none}
.sl .dial:not(.list) .sel{background:var(--panel)}

.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.choices button{background:var(--bg);color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.choices button[aria-pressed="true"]{background:var(--fg);color:var(--on)}
.primary{background:var(--fg);color:var(--on);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.1em}
.muted{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin:0}
</style>
</head>
<body>
<div class="screen" id="editScreen">
  <input type="file" id="file" accept="image/*">
  <div class="top" id="topBar">
    <label class="btn" for="file" id="change" hidden>Photo</label>
    <button type="button" id="cancel" hidden>Cancel</button>
    <span class="sp"></span>
    <button type="button" class="ico" id="undo" title="Undo" disabled hidden>↶</button>
    <button type="button" class="ico" id="redo" title="Redo" disabled hidden>↷</button>
    <button type="button" id="reset" title="Reset all settings" hidden>Reset</button>
  </div>

  <div class="photo" id="photoArea">
    <div class="empty" id="empty">
      <label class="pick" for="file" id="pickText">Choose a photo</label>
      <p id="pickMsg">Hide people’s identity and image metadata, right on your phone. Nothing is sent.</p>
    </div>
    <canvas id="view" hidden></canvas>
    <div class="tip" id="tip">↕ options · ↔ adjust</div>
  </div>

  <div class="drawer" id="drReglages" hidden><div class="sl" id="rSlider"></div></div>
  <div class="drawer" id="drRendu" hidden><div class="sl" id="tSlider"></div></div>
  <div class="drawer" id="drExport" hidden>
    <div class="choices">
      <button data-fmt="jpeg" aria-pressed="true">JPEG</button>
      <button data-fmt="png" aria-pressed="false">PNG</button>
    </div>
    <button type="button" class="primary" id="save">Save</button>
    <p class="muted" id="saveMsg">No EXIF metadata.</p>
  </div>

  <div id="busy" hidden><span>Analysing</span><span class="dots"><i></i><i></i><i></i></span></div>
  <div id="shade" hidden></div>
  <div id="wheel" hidden><div id="wheelItems"></div></div>
  <div class="bottom one" id="manualBar" hidden><button type="button" id="validate">Done</button></div>
  <div class="bottom" id="bottom" hidden>
    <button type="button" data-dr="Reglages">Settings</button>
    <button type="button" data-dr="Rendu">Style</button>
    <button type="button" data-dr="Export">Export</button>
  </div>
</div>

<script type="module">
import * as ort from './vendor/ort.wasm.bundle.min.mjs';
(() => {
  const MAX = 1024;      // long edge, in pixels, fed to the detector on the first pass (multiple of 32)
  const THRESH = 0.12;   // detector floor: every candidate above this is kept, the Seuil slider filters at render time
  const $ = id => document.getElementById(id);
  const base = document.createElement('canvas');   // the source, at most 1600 px
  const out  = $('view');                          // the render, shown directly (no re-encoding per frame)
  let faces = [], modelReady = null, det, lmk, fmt = 'jpeg';

  // ---------- state, history ----------
  const HUES = Array.from({ length: 32 }, (_, i) => i * 11.25);                       // 32 hues around the wheel
  const hsl = (h, l = 55) => `hsl(${h} 85% ${l}%)`;
  // Only solid, round heads: an emoji with holes or a thin shape would let the face show through.
  const EMOJIS = ['😀','😃','😎','🤫','😶','🥸','🤡','👽','🤖','🎃','😷','🧐','😺','🐵','🐸','🦊','🐼','🐻','🦁','🐯',
                  '🌝','🌞','😈','🥶','😡','🤓','😴','🥳','🐶','🐷','🐨','🐮'];
  // A colour scale shared by several sliders: 0 = white, 1 = black, 2…33 = the 32 hues, 34 = multi (always last).
  const MULTI = 34, RAINBOW = 'linear-gradient(90deg,#f33,#fc0,#3c3,#09f,#90f)';
  const swatch = v => v === 0 ? '#fff' : v === 1 ? '#000' : hsl(HUES[v - 2]);     // v < MULTI
  const scale = (k, label) => ({ k, label, min: 0, max: MULTI, step: 1, list: true, num: v => String(v + 1),
    desc: v => v === MULTI ? 'Multicolour' : v === 0 ? 'White' : v === 1 ? 'Black' : `Hue ${v - 1}`, hues: [2, MULTI - 1],
    chip: v => v === MULTI ? RAINBOW : swatch(v) });
  const OVERLAYS = ['None', 'Box', 'Outline', 'Points', 'Box + score', 'All'];   // debug overlays drawn on the masked faces
  // Every setting is one dial. Réglages is a list of them; Rendu is a list of styles, each one dial. Vertical drag moves through the list.
  // num: what the dial centre shows. desc: the full meaning, shown on the dial only while it is being adjusted.
  const OPTS = {
    reglages: [
      // Seuil: right = more faces (lower detector threshold); fully right takes every candidate.
      // Seuil counts faces: one notch per candidate, in order of detector confidence (most obvious first).
      { k: 'nb', label: 'Threshold', min: 0, get max() { return Math.max(1, faces.length); }, step: 1, num: v => String(v) },
      // Marge 0…1 → contour × (0.7 + marge): 0.3 is the bare contour.
      { k: 'marge', label: 'Margin', min: 0, max: 1, step: 0.1, num: v => v.toFixed(1) },
      { k: 'boxes', label: 'Overlay', min: 0, max: 5, step: 1, list: true, num: v => String(v), desc: v => OVERLAYS[v] },
      // Manuel: a button instead of a dial; the photo goes full screen and tapping a face toggles its mask.
      { k: 'manual', label: 'Manual', button: 'Select faces' },
    ],
    rendu: [
      scale('couleur', 'Colour'),
      scale('carre', 'Square'),
      // Bruit: left half = photo tint, right half = random colours; the outer notch of each half is the big grain.
      { k: 'bruit', label: 'Noise', min: 0, max: 3, step: 1, list: true, num: v => String(v + 1), desc: v => ['Photo · coarse', 'Photo · fine', 'Colours · fine', 'Colours · coarse'][v] },
      { k: 'emoji', label: 'Emoji', min: 0, max: EMOJIS.length, step: 1, list: true, emoji: true,
        num: v => v === EMOJIS.length ? '?' : EMOJIS[v], desc: v => v === EMOJIS.length ? 'Random' : `No. ${v + 1}` },
      { k: 'lumiere', label: 'Light', min: -1, max: 1, step: 0.05, mid: 0,
        num: v => (v > 0 ? '+' : '') + Math.round(v * 100), desc: v => v > 0 ? 'Light' : v < 0 ? 'Dark' : 'Neutral' },
      scale('neon', 'Neon'),
    ],
  };
  const STYLES = OPTS.rendu.map(o => o.k);
  const DEFAULTS = { style: 'couleur', couleur: MULTI, carre: MULTI, bruit: 1, emoji: EMOJIS.length, lumiere: 0.5, neon: MULTI, sens: 0.7, nb: 0, marge: 0.3, boxes: 0, seed: 0, sel: {} };
  // Settings survive photo changes and reloads until Reset (stored in this browser only).
  const load = () => { try { const s = JSON.parse(localStorage.getItem('vl-state-7') || 'null'); return s ? { ...DEFAULTS, ...s } : null; } catch { return null; } };
  const save = () => { try { localStorage.setItem('vl-state-7', JSON.stringify(state)); } catch {} };
  let state = load() || { ...DEFAULTS, seed: (Math.random() * 100) | 0 }, drawer = null, hist = [], hi = -1;
  const cur = { reglages: 0 };   // selected Réglages option (not part of history); the Rendu option is state.style

  // Small seeded PRNG so a given seed always gives the same colours/emojis/noise.
  function prng(seed) { let a = (seed * 7919 + 1) >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  function commit() { hist = hist.slice(0, hi + 1); hist.push({ ...state }); hi = hist.length - 1; save(); sync(); }
  function restore(s) { state = { ...s }; save(); sync(); render(); }
  const context = () => drawer === 'Reglages' ? 'reglages' : drawer === 'Rendu' ? 'rendu' : null;
  const thr = () => 1 - state.sens;
  // Seuil is stored as a score threshold (so it carries over to the next photo) and shown as a face count.
  const countFromSens = () => faces.filter(f => f.box.score >= thr()).length;
  function sensFromCount(k) {   // threshold halfway between the k-th and (k+1)-th most confident faces
    const s = i => faces[i].box.score;
    const t = !faces.length ? thr() : k <= 0 ? s(0) + 0.005 : k >= faces.length ? s(faces.length - 1) - 0.005 : (s(k - 1) + s(k)) / 2;
    state.sens = +(1 - t).toFixed(5);
  }
  let pending = 0;                    // at most one render per animation frame
  const schedule = () => { if (!pending) pending = requestAnimationFrame(() => { pending = 0; render(); }); };   // detector score a face needs to be masked
  let full = false, manual = false;   // photo-only view · manual face selection
  // A face is masked when the seuil includes it, unless the manual selection says otherwise.
  const isShown = i => state.sel[i] !== undefined ? state.sel[i] : i < state.nb;
  const idx = c => c === 'rendu' ? STYLES.indexOf(state.style) : cur[c];
  const option = () => { const c = context(); return c ? OPTS[c][idx(c)] : null; };
  const ticksOf = o => { const n = Math.round((o.max - o.min) / o.step); return n <= 200 ? n : 40; };   // one tick per entry, 40 when continuous
  function setValue(o, v) { v = Math.min(o.max, Math.max(o.min, Math.round(v / o.step) * o.step)); state[o.k] = +v.toFixed(4); if (o.k === 'nb') sensFromCount(state.nb); }

  // Haptics: a real tick on each notch — vibrate() where it exists (Android), the iOS switch-toggle trick otherwise.
  // iOS has no vibration API: clicking the label of a native switch makes Safari (18+) play its system tick.
  // Progressive: notches in quick succession build up (Android: longer pulses). iOS only offers one fixed tick.
  const hap = (() => {
    let last = 0, streak = 0;
    return () => {
      const t = performance.now(); if (t - last < 30) return;
      streak = t - last < 160 ? Math.min(streak + 1, 10) : 0; last = t;
      if (navigator.vibrate) { navigator.vibrate(Math.round(4 + streak * 1.6)); return; }
      const label = document.createElement('label'), sw = document.createElement('input');
      sw.type = 'checkbox'; sw.setAttribute('switch', ''); label.append(sw); label.style.display = 'none'; label.ariaHidden = 'true';
      document.head.append(label); label.click(); label.remove();
    };
  })();
  const notch = (o, v) => Math.round((v - o.min) / (o.max - o.min) * ticksOf(o));

  // Dial block: first row is the option menu (press it, or drag vertically anywhere, to scroll the options).
  // Below it a dark groove across the screen; the dial slides inside it under a fixed square selector.
  //  · list options: the entries themselves, as squares (colour, number or emoji); the hues form one continuous bar.
  //  · continuous options: one small square per increment, the middle one larger; the value is written in the selector.
  // Weight: the dial eases toward the finger and settles on a notch; a flick keeps it spinning against friction.
  function makeSlider(root) {
    root.innerHTML = '<div class="menu"><span class="chev">⇅</span><span class="name"></span></div><div class="dial"><div class="strip"></div><div class="sel"></div></div><button type="button" class="go" hidden></button>';
    const q = s => root.querySelector(s), name = q('.name'), dial = q('.dial'), strip = q('.strip'), sel = q('.sel'), go = q('.go');
    go.addEventListener('click', () => o && o.button && enterManual());
    let o = null, n = 1, sp = 16, built = '', pos = 0, target = 0, raf = 0, held = false;
    const at = j => +(o.min + j / n * (o.max - o.min)).toFixed(4);
    const unit = () => (o.max - o.min) / n;
    function build() {
      const key = o.k + '/' + dial.clientWidth + '/' + o.max;
      if (key === built) return false; built = key;
      n = ticksOf(o);
      // Few entries → big squares far apart; many → small squares packed tight.
      sp = o.list ? 48 : Math.max(12, Math.min(48, dial.clientWidth * 0.7 / n));
      strip.style.setProperty('--pip', Math.round(Math.max(4, Math.min(20, sp * 0.4))) + 'px');
      strip.textContent = ''; dial.classList.toggle('list', !!o.list);
      const add = (cls, j) => { const d = document.createElement('div'); d.className = cls; d.style.left = (j * sp) + 'px'; strip.append(d); return d; };
      if (o.hues) {   // the hue range is one bar with a continuous gradient; each hue still has its own notch
        const [a, b] = o.hues, w = (b - a) * sp, bar = add('bar', a);
        bar.style.width = (w + 32) + 'px';
        bar.style.background = `linear-gradient(90deg, ${Array.from({ length: b - a + 1 }, (_, k) => `${hsl(HUES[k])} ${((16 + k * sp) / (w + 32) * 100).toFixed(2)}%`).join(', ')})`;
      }
      for (let j = 0; j <= n; j++) {
        if (o.hues && j >= o.hues[0] && j <= o.hues[1]) continue;
        if (o.list) {
          const v = at(j), d = add('sq', j);
          if (o.chip) { d.classList.add('sw'); d.style.background = o.chip(v); }
          else if (o.emoji) { d.classList.add('em'); d.textContent = o.num(v); }
          else d.textContent = o.num(v);
        } else add(o.mid !== undefined && Math.abs(at(j) - o.mid) < 1e-6 ? 'pip mid' : 'pip', j);
      }
      return true;
    }
    const paint = () => { strip.style.transform = `translate3d(${dial.clientWidth / 2 - (pos - o.min) / unit() * sp}px,0,0)`; };
    function animate() {   // ease the shown position toward the target: the dial has weight but never lags far
      if (raf) return;
      const tick = () => {
        pos += (target - pos) * (held ? 0.45 : 0.28);
        if (Math.abs(target - pos) < unit() * 0.004) pos = target;
        paint();
        raf = pos === target ? 0 : requestAnimationFrame(tick);
      };
      raf = requestAnimationFrame(tick);
    }
    function draw() {
      if (!o) return;
      name.textContent = o.label;
      if (o.button) { dial.hidden = true; go.hidden = false; go.textContent = o.button; return; }
      dial.hidden = false; go.hidden = true;
      const fresh = build(), v = +state[o.k];
      sel.textContent = o.list ? '' : o.num(v);
      if (!held) target = v;
      if (fresh) { pos = target; paint(); } else animate();
    }
    function place(p) {   // p: unrounded position in value units; the state takes the rounded step
      target = Math.min(o.max, Math.max(o.min, p)); animate();
      const v0 = +state[o.k]; setValue(o, p);
      if (+state[o.k] !== v0) { hap(); activity(); sync(); schedule(); }
    }
    let drag = null, spin = 0;
    dial.addEventListener('pointerdown', e => {
      if (!o) return; e.preventDefault(); dial.setPointerCapture(e.pointerId); cancelAnimationFrame(spin); spin = 0;
      held = true;
      drag = { id: e.pointerId, x: e.clientX, p0: target, start: +state[o.k], lx: e.clientX, lt: e.timeStamp, vel: 0 };
    });
    dial.addEventListener('pointermove', e => {

      const v = +state.bruit, grain = v === 0 || v === 3 ? 6 : 14;
      if (v < 2) { const c = poly.mean; noise(ctx, b, grain, () => `rgb(${c.map(x => Math.min(255, x * (0.55 + 0.9 * rand())) | 0).join(',')})`); }
      else noise(ctx, b, grain, () => randHue(rand));
    } else if (st === 'emoji') {
      // nothing under the emoji: the glyph alone is sized to cover the whole contour
    } else {
      const v = +state.couleur; ctx.fillStyle = v === MULTI ? randHue(rand) : swatch(v); ctx.fill();
    }
    ctx.restore();
    if (st === 'emoji') {
      const v = +state.emoji, ch = v === EMOJIS.length ? EMOJIS[(rand() * EMOJIS.length) | 0] : EMOJIS[v];
      ctx.font = `${s * 1.4}px system-ui, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(ch, cx, cy);
    }
  }

  // Contour and mean colour are cached per face; they only change with Marge.
  function shape(f, m) {
    if (f.m !== m) { f.m = m; f.poly = contour(f.pts, m); f.poly.mean = meanColor(bounds(f.poly)); }
    return f.poly;
  }
  function render() {
    if (!base.width) return;
    if (out.width !== base.width || out.height !== base.height) { out.width = base.width; out.height = base.height; fit(); }
    const m = 0.7 + +state.marge;
    const ctx = out.getContext('2d');
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(base, 0, 0);
    const shown = faces.filter((f, i) => isShown(i));   // faces are sorted by confidence
    // One random stream per face (seed + index): toggling a face never reshuffles the others.
    faces.forEach((f, i) => { if (isShown(i)) paintFace(ctx, shape(f, m), prng(state.seed * 1000 + i)); });
    // Overlays: 1 box · 2 mask outline · 3 landmarks · 4 box + score · 5 all. Never exported.
    const B = +state.boxes;
    if (B) {
      const r = Math.max(1, base.width / 900);
      ctx.lineWidth = Math.max(1.5, base.width / 700);
      ctx.font = `${Math.max(11, base.width / 60)}px ui-monospace, monospace`; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
      for (const f of shown) {
        const bx = f.box;
        if (B === 1 || B >= 4) { ctx.strokeStyle = '#ff5a3c'; ctx.strokeRect(bx.x1, bx.y1, bx.x2 - bx.x1, bx.y2 - bx.y1); }
        if (B >= 4) { ctx.fillStyle = '#ff5a3c'; ctx.fillText(bx.score.toFixed(2), bx.x1, bx.y1 - 2); }
        if (B === 2 || B === 5) { ctx.strokeStyle = '#fff'; trace(ctx, f.poly); ctx.stroke(); }
        if (B === 3 || B === 5) { ctx.fillStyle = '#fff'; for (const p of f.pts) { ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill(); } }
      }
    }
  }
  // Size the canvas to fit the photo area (it shrinks when a drawer opens).
  function fit() {
    if (!out.width) return;
    const a = $('photoArea'), W = a.clientWidth - 12, H = a.clientHeight - 12, k = Math.min(W / out.width, H / out.height);
    out.style.width = Math.floor(out.width * k) + 'px'; out.style.height = Math.floor(out.height * k) + 'px';
  }
  new ResizeObserver(fit).observe($('photoArea'));

  // ---------- flow ----------
  // ---------- flow ----------
  function fileToImage(file) {
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file);
      const im = new Image();
      im.onload = () => { URL.revokeObjectURL(url); res(im); };
      im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Unreadable image')); };
      im.src = url;
    });
  }

  async function process(file) {
    $('pickMsg').classList.remove('err');
    $('busy').hidden = false;
    await new Promise(r => requestAnimationFrame(() => setTimeout(r, 30)));   // let the overlay paint before the heavy work
    try {
      const [im] = await Promise.all([fileToImage(file), loadModel()]);
      const s = Math.min(1, 1600 / Math.max(im.naturalWidth, im.naturalHeight));
      base.width = Math.round(im.naturalWidth * s);
      base.height = Math.round(im.naturalHeight * s);
      base.getContext('2d').drawImage(im, 0, 0, base.width, base.height);

      const t0 = performance.now();
      // Pass 1 at 1024 px. Crowd (5+ sure faces, or small faces) → pass 2 at full working size, merged by NMS.
      let boxes = await detectFaces(base, MAX, THRESH);
      const sure = boxes.filter(b => b.score >= 0.3), widths = sure.map(b => b.x2 - b.x1).sort((a, b) => a - b);
      const small = widths.length && widths[widths.length >> 1] < base.width * 0.05;
      if ((sure.length >= 5 || small) && Math.max(base.width, base.height) > MAX) {
        boxes = nms(boxes.concat(await detectFaces(base, 1600, THRESH)), 0.4);
      }
      const t1 = performance.now();
      faces = [];
      for (const box of boxes) faces.push({ box, pts: await landmarks(base, box) });   // boxes come sorted by score (NMS)
      const t2 = performance.now();

      state.nb = countFromSens(); state.sel = {};
      hist = []; hi = -1; commit();   // keep the current settings; only the history restarts with the new photo
      render();
      console.info(`detection ${Math.round(t1 - t0)} ms · contours ${Math.round(t2 - t1)} ms`);
      for (const id of ['empty']) $(id).hidden = true;
      for (const id of ['view', 'change', 'undo', 'redo', 'reset', 'bottom']) $(id).hidden = false;
      $('editScreen').classList.add('ready');
      for (const f of faces) f.m = null;
      if (manual) exitManual(false);
      full = false; $('editScreen').classList.remove('full'); cur.reglages = 0; openDrawer('Reglages'); fit(); render();
    } catch (err) {
      $('pickMsg').textContent = 'Error: ' + (err && err.message || err); $('pickMsg').classList.add('err'); $('empty').hidden = false; $('view').hidden = true;
    }
    $('busy').hidden = true; $('file').value = '';
  }

  // ---------- wiring ----------
  buildPanels(); sync();
  $('file').addEventListener('change', e => { if (e.target.files[0]) process(e.target.files[0]); });
  $('undo').addEventListener('click', () => { if (hi > 0) restore(hist[--hi]); });
  $('redo').addEventListener('click', () => { if (hi < hist.length - 1) restore(hist[++hi]); });
  $('reset').addEventListener('click', () => { state = { ...DEFAULTS, seed: state.seed }; state.nb = countFromSens(); commit(); render(); });
  for (const b of document.querySelectorAll('#bottom button')) b.addEventListener('click', () => openDrawer(b.dataset.dr));
  $('drExport').addEventListener('click', e => {
    const b = e.target.closest('[data-fmt]'); if (!b) return;
    fmt = b.dataset.fmt; for (const x of $('drExport').querySelectorAll('[data-fmt]')) x.setAttribute('aria-pressed', x.dataset.fmt === fmt);
  });
  $('save').addEventListener('click', async () => {
    // Re-render without the debug overlay, then hand the file over. Canvas export carries no EXIF.
    const boxes = state.boxes; state.boxes = 0; render(); state.boxes = boxes;
    const blob = await new Promise(r => out.toBlob(r, fmt === 'png' ? 'image/png' : 'image/jpeg', 0.92));
    if (boxes) render();
    const filename = `notus.${fmt === 'png' ? 'png' : 'jpg'}`;
    const dl = window.claude ? await claude.use('downloads') : null;   // claude.ai viewer: share sheet / download prompt
    if (dl) {
      try { await dl.save({ filename, data: blob }); $('saveMsg').textContent = 'Saved.'; }
      catch (e) { $('saveMsg').textContent = e.code === 'declined' ? 'Cancelled.' : 'Could not save: ' + (e.message || e.code); }
      return;
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;   // plain web: browser download
    document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  });

  const pin = () => { if (scrollX || scrollY) scrollTo(0, 0); };
  addEventListener('scroll', pin, { passive: true }); visualViewport && visualViewport.addEventListener('resize', pin);
  loadModel().catch(err => { $('pickMsg').textContent = 'Could not load the model: ' + (err && err.message || err); $('pickMsg').classList.add('err'); });
})();
</script>

</body>
</html>
